[package]
name = "garust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Geometric Algebra in Rust — generic over the Clifford signature Cl(P, Q, R) and the scalar type."
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["geometric-algebra", "clifford-algebra", "math", "ga"]
categories = ["mathematics"]

[lib]
name = "garust"

[features]
default = ["std"]
# Standard-library float math, forwarded to both members. On by default; the
# crates are otherwise `#![no_std]`. For no_std, use `default-features =
# false` and enable `libm`.
std = ["garust-core/std", "garust-geo/std"]
# `no_std` float math via `libm`, forwarded to both members.
libm = ["garust-core/libm", "garust-geo/libm"]
# Opt-in `#[derive(Algebra)]`, forwarded to garust-core. Off by default so
# the umbrella crate stays dependency-free unless you ask for the derive.
derive = ["garust-core/derive"]
# Opt-in serde for every type, forwarded to both member crates. Off by
# default so the umbrella crate stays dependency-free.
serde = ["garust-core/serde", "garust-geo/serde"]
# Opt-in bytemuck (Pod/Zeroable) for every type, forwarded to both member
# crates. Off by default so the umbrella crate stays dependency-free.
bytemuck = ["garust-core/bytemuck", "garust-geo/bytemuck"]

[dependencies]
# Inherit `default-features = false` from `[workspace.dependencies]`, so the
# umbrella's `std`/`libm` features choose the members' math backend.
garust-core = { workspace = true }
garust-geo = { workspace = true }

[workspace]
members = ["crates/garust-core", "crates/garust-geo", "crates/garust-derive"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT OR Apache-2.0"
repository = "https://github.com/westerngazoo/garust"

# `default-features = false` here (not at the member level, where it would be
# ignored for an inherited dep) so each crate's own `std`/`libm` feature picks
# the math backend rather than always pulling in core's default `std`.
[workspace.dependencies]
garust-core = { version = "0.1.0", path = "crates/garust-core", default-features = false }
garust-geo = { version = "0.1.0", path = "crates/garust-geo", default-features = false }
garust-derive = { version = "0.1.0", path = "crates/garust-derive" }

# Proc-macro toolchain — pulled in only when the optional `derive` feature
# is enabled, so the default build stays dependency-free.
syn = "2"
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"

# Property-based testing. A dev-dependency only (see each crate's
# [dev-dependencies]): it never enters the normal dependency graph, so
# downstream consumers and the default build stay dependency-free.
proptest = "1"

# Benchmarking harness — a dev-dependency only, for the `benches/`. Never in
# the normal dependency graph. `default-features = false` drops the optional
# plotting/html-report stack we don't need in CI.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Optional (de)serialization, gated behind each crate's `serde` feature and
# off by default — so it stays out of the normal dependency graph and the
# default build remains dependency-free. `default-features = false` keeps it
# no_std-ready for the planned alloc/libm split.
serde = { version = "1", default-features = false, features = ["derive"] }
# JSON — a dev-dependency only, for the serde round-trip tests.
serde_json = "1"

# Optional zero-copy plain-old-data casts, behind each crate's `bytemuck`
# feature and off by default. `default-features = false` keeps it no_std-ready
# and out of the normal dependency graph for the default build.
bytemuck = { version = "1", default-features = false }

# Pure-Rust float math for `no_std` builds, behind the `libm` feature (an
# alternative to the default `std` math backend). Itself dependency-free.
libm = "0.2"
