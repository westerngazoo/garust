[package]
name = "garust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Geometric Algebra in Rust — generic over the Clifford signature Cl(P, Q, R) and the scalar type."
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["geometric-algebra", "clifford-algebra", "math", "ga"]
categories = ["mathematics"]

[lib]
name = "garust"

[features]
# Opt-in `#[derive(Algebra)]`, forwarded to garust-core. Off by default so
# the umbrella crate stays dependency-free unless you ask for the derive.
derive = ["garust-core/derive"]

[dependencies]
garust-core = { workspace = true }
garust-geo = { workspace = true }

[workspace]
members = ["crates/garust-core", "crates/garust-geo", "crates/garust-derive"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT OR Apache-2.0"
repository = "https://github.com/westerngazoo/garust"

[workspace.dependencies]
garust-core = { version = "0.1.0", path = "crates/garust-core" }
garust-geo = { version = "0.1.0", path = "crates/garust-geo" }
garust-derive = { version = "0.1.0", path = "crates/garust-derive" }

# Proc-macro toolchain — pulled in only when the optional `derive` feature
# is enabled, so the default build stays dependency-free.
syn = "2"
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"

# Property-based testing. A dev-dependency only (see each crate's
# [dev-dependencies]): it never enters the normal dependency graph, so
# downstream consumers and the default build stay dependency-free.
proptest = "1"
