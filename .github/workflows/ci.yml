name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Tests (all features — exercises #[derive(Algebra)])
        run: cargo test --workspace --all-targets --all-features

      - name: Doc tests
        run: cargo test --workspace --doc

      - name: Docs (deny broken intra-doc links)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: minimum supported Rust (1.79)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.79
        uses: dtolnay/rust-toolchain@1.79

      - uses: taiki-e/install-action@cargo-hack

      # The MSRV gate covers the *consumer surface* — the libraries — which is
      # the zero-dependency promise downstream users actually compile.
      # `cargo hack --no-dev-deps` strips dev-dependencies *before resolving*,
      # so test-only tooling (proptest, criterion) and its transitive deps —
      # some of which now require a newer edition than cargo 1.79 can even
      # parse — never enter the dependency graph. (A plain `cargo build --lib`
      # still resolves the whole workspace, dev-deps included, and would choke
      # on those manifests.) garust-derive is excluded: its proc-macro
      # toolchain (syn, proc-macro-crate) has its own, higher MSRV.
      - name: Check libraries on MSRV
        run: cargo hack check --no-dev-deps --workspace --exclude garust-derive --lib

  no_std:
    name: no_std (bare-metal + libm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with a bare-metal target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      # Build the libraries for a target that has no `std` at all: this fails
      # if anything outside the `std` feature touches the standard library.
      # `libm` supplies the float transcendentals in std's place, and the
      # last build also confirms serde + bytemuck compose under no_std.
      - name: Build core (no_std + libm)
        run: cargo build -p garust-core --no-default-features --features libm --target thumbv7em-none-eabi
      - name: Build geo (no_std + libm)
        run: cargo build -p garust-geo --no-default-features --features libm --target thumbv7em-none-eabi
      - name: Build physics (no_std + libm)
        run: cargo build -p garust-physics --no-default-features --features libm --target thumbv7em-none-eabi
      - name: Build umbrella (no_std + libm + serde + bytemuck + physics)
        run: cargo build -p garust --no-default-features --features "libm serde bytemuck physics" --target thumbv7em-none-eabi
